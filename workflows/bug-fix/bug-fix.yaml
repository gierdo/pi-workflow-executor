name: bug-fix
version: 5
description: >-
  Drive a bug from report to a verified fix, root-cause first: invoke `debug`
  to prove the root cause in `bugs/{task}/diagnosis.md`, plan the fix (in an
  OpenSpec change when OpenSpec is present, or `.workflow/plans/{task}/plan.md`),
  implement the fix and regression test, verify the full suite, and integrate.

inputs:
  task:
    description: "Kebab-case bug slug (also OpenSpec change name when OpenSpec is used)."
    required: true

artifacts:
  diagnosis:
    path: "bugs/{task}/diagnosis.md"
    description: "Output of `debug`: report, reproduction steps/test, proven root cause, blast radius, fix approach."
  plan:
    path: ".workflow/plans/{task}/plan.md"
    description: "Standalone fix plan and tasks when OpenSpec is not used."
  proposal:
    path: "<changeRoot>/proposal.md"
    description: "Bug summary, proven root cause, blast radius, and fix approach (OpenSpec)."
  specs_delta:
    path: "<changeRoot>/specs/<capability-path>/spec.md"
    description: "MODIFIED/ADDED requirements with a regression scenario for the trigger (OpenSpec)."
  design:
    path: "<changeRoot>/design.md"
    description: "Fix design and regression-test strategy (OpenSpec)."
  tasks:
    path: "<changeRoot>/tasks.md"
    description: "Ordered steps: capture failing test, fix root cause, green regression test (OpenSpec)."
  repro:
    path: "<changeRoot>/repro.md"
    description: "Copy of diagnosis reproduction steps and test path archived with OpenSpec change."

initial: debug

states:
  debug:
    invoke:
      workflow: debug
    goal: >-
      Run the `debug` sub-workflow for `{task}` to produce a reliable
      reproduction and proven root cause in `bugs/{task}/diagnosis.md`.
    produces: [diagnosis]
    exit_gate: "Child `debug` run completed in `done` with proven root cause and fix approach."
    transitions:
      - outcome: debug_aborted
        when: "Child `debug` run ended in `abort`."
        to: abort
        reason: "debug aborted; report findings without planning a fix"
      - outcome: debug_completed
        to: plan
        reason: "root cause proven"

  plan:
    goal: >-
      Turn `bugs/{task}/diagnosis.md` into an actionable fix plan:
      - When OpenSpec is present: create or update the change (`openspec-propose`
        or `openspec-update-change`) with `proposal.md`, delta spec scenario,
        `tasks.md`, and `repro.md`.
      - When OpenSpec is absent: write `.workflow/plans/{task}/plan.md` with root
        cause, reproduction test path, and ordered fix tasks.
    consumes: [diagnosis]
    produces: [plan, proposal, specs_delta, design, tasks, repro]
    exit_gate: "Fix plan and tasks trace directly to reproducing, fixing, and regression-guarding the root cause."
    transitions:
      - outcome: diagnosis_invalidated
        when: "Planning exposed that the diagnosis is incomplete or wrong."
        to: debug
        reason: "refinement: planning invalidated diagnosis"
        max_retries: 2
      - outcome: reporting_gap_found
        when: "Planning exposed that the bug report or expected behavior is wrong."
        to: debug
        reason: "refinement: planning exposed a reporting gap"
        max_retries: 2
      - outcome: plan_ready
        to: fix
        reason: "fix plan ready"

  fix:
    goal: >-
      Implement the planned fix at the root cause (delegating to
      `task-implementation` workers for multi-task fixes or executing directly
      for single-task fixes). Keep changes minimal and turn the reproduction
      into a passing automated regression test.
    consumes: [plan, proposal, specs_delta, design, tasks, repro]
    produces: [tasks, plan]
    exit_gate: "Root-cause fix implemented, reproduction no longer triggers, and regression test passes."
    transitions:
      - outcome: fix_invalidated_diagnosis
        when: "The fix did not stop the reproduction or revealed a different root cause."
        to: debug
        reason: "refinement: fix invalidated the diagnosis"
        max_retries: 2
      - outcome: fix_invalidated_plan
        when: "The diagnosis holds, but the fix plan or tasks need revision."
        to: plan_revision
        reason: "refinement: fix invalidated the plan"
        max_retries: 2
      - outcome: fix_exposed_reporting_gap
        when: "The reported bug is only one facet of a broader defect."
        to: debug
        reason: "refinement: fix exposed a deeper reporting gap"
        max_retries: 2
      - outcome: fix_implemented
        to: verify
        reason: "fix implemented and regression test green"

  plan_revision:
    goal: >-
      Reconcile the fix plan or OpenSpec change artifacts with what
      implementation or verification uncovered.
    consumes: [plan, proposal, specs_delta, design, tasks, repro]
    produces: [plan, proposal, specs_delta, design, tasks]
    exit_gate: "Fix plan artifacts are updated and coherent with the diagnosis."
    transitions:
      - outcome: plan_reconciled
        to: fix
        reason: "plan reconciled; resume fix"

  verify:
    goal: >-
      Run the project's full verification suite (build, tests, lint) and, when
      OpenSpec is used, `openspec validate`. Confirm the original trigger is
      fixed, the regression test guards it, and no regressions were introduced.
    consumes: [plan, proposal, repro]
    exit_gate: "Full suite and validation pass, original trigger is fixed, and regression test passes."
    transitions:
      - outcome: code_verification_failed
        when: "A check failed, the bug still reproduces, or unrelated tests regressed."
        to: fix
        reason: "verification failed"
        max_retries: 2
      - outcome: artifact_validation_failed
        when: "Artifact validation flagged malformed or inconsistent planning files."
        to: plan_revision
        reason: "refinement: validation surfaced a planning gap"
        max_retries: 2
      - outcome: fix_verified
        to: integration
        reason: "fix verified and regression guarded"

  integration:
    goal: >-
      Land the fix per repository conventions, clean up any temporary files or
      worktrees, and when OpenSpec is used, archive the change
      (`openspec-archive-change`).
    consumes: [plan, proposal, specs_delta, repro]
    exit_gate: "Committed per repo conventions, temporary artifacts cleaned up, and OpenSpec change archived if applicable."
    transitions:
      - outcome: integration_code_defect
        when: "Landing surfaced a code defect."
        to: fix
        reason: "integration surfaced a defect; fix then re-verify"
        max_retries: 2
      - outcome: sync_artifact_blocked
        when: "OpenSpec sync or archive hit an artifact error."
        to: plan_revision
        reason: "refinement: sync/archive surfaced a planning gap"
        max_retries: 2
      - outcome: integration_completed
        to: done
        reason: "fix landed and archived"
        requires_approval: true

  abort:
    terminal: true
    goal: "Ended without a fix because `debug` aborted. Report child findings."

  done:
    terminal: true
    goal: "Bug reproduced, root-caused, fixed, verified with a regression test, and integrated."

herdr:
  suggested_panes:
    - role: verify
      lifecycle: persistent
      purpose: "Reproduction and regression test watcher for fix and verify gates."
