name: code-reconnaissance
version: 2
description: >-
  Read-only codebase reconnaissance: map relevant files, conventions, tooling,
  dependencies, and gotchas for a downstream planning or implementation agent.
  Every claim must be grounded in code actually read.

inputs:
  task:
    description: "Kebab-case slug identifying what this reconnaissance is for."
    required: true

artifacts:
  context:
    path: ".workflow/runs/code-reconnaissance/{task}/scout-context.md"
    description: >-
      Grounded reconnaissance report: relevant files and entry points, project
      tooling/commands, conventions, dependency usage, and implementation
      gotchas. Omit empty sections.

initial: orient

states:
  orient:
    goal: >-
      Confirm an existing codebase is present and frame the specific questions
      the downstream agent needs answered.
    exit_gate: "Existing codebase confirmed and concrete reconnaissance questions framed."
    transitions:
      - outcome: no_codebase
        when: "No codebase exists to explore, or the request asks for code edits rather than reconnaissance."
        to: abort
        reason: "nothing to reconnoitre: no codebase or wrong task type"
      - outcome: questions_framed
        to: explore
        reason: "questions framed; explore and read relevant code"

  explore:
    goal: >-
      Locate and read the relevant files, entry points, data flow, and config
      files (package.json, tsconfig.json, Cargo.toml, pyproject.toml, etc.).
      Establish real build/test commands, code conventions, dependency patterns,
      and gotchas from code actually read, never inferred from filenames.
    subagent: scout
    exit_gate: "Relevant code and config files read in depth; all framed questions answered with grounded evidence."
    transitions:
      - outcome: framing_gap_found
        when: "Exploration showed the initial questions were misframed or too narrow."
        to: orient
        reason: "refinement: exploration exposed a framing gap"
        max_retries: 2
      - outcome: code_understood
        to: report
        reason: "relevant code read and understood; write context report"

  report:
    goal: >-
      Write the grounded findings to the context artifact, omitting empty
      sections, and report the artifact path for downstream agents.
    produces: [context]
    exit_gate: "Context artifact written with grounded claims answering all framed questions."
    transitions:
      - outcome: unanswered_question_found
        when: "Writing the report exposed an unanswered question requiring further code reading."
        to: explore
        reason: "refinement: report exposed an unanswered question"
        max_retries: 2
      - outcome: report_delivered
        to: done
        reason: "grounded context report delivered"

  abort:
    terminal: true
    goal: "Stopped: no codebase to explore or task is not reconnaissance."

  done:
    terminal: true
    goal: "Relevant codebase mapped and grounded context report delivered."

herdr:
  suggested_panes:
    - role: explore
      lifecycle: persistent
      purpose: "Holds files and search results during explore."
