name: debug
version: 3
description: >-
  Take a bug report to a proven root cause and stop there: triage -> reproduce ->
  diagnose, producing `bugs/{task}/diagnosis.md`. Never modifies product code
  permanently (failing reproduction tests are kept; temporary diagnostic
  instrumentation must be removed before completion).

inputs:
  task:
    description: "Kebab-case bug slug (e.g. login-500-on-empty-email)."
    required: true
  require_openspec:
    description: "When true, verify OpenSpec usability during triage."
    required: false

artifacts:
  diagnosis:
    path: "bugs/{task}/diagnosis.md"
    description: >-
      Durable diagnosis report with sections: Report (observed vs expected,
      environment, trigger), Reproduction (minimal steps and failing test path),
      Root cause (with proving evidence), Blast radius, Fix approach, and
      Revision history (when re-entered from a parent workflow).

initial: triage

states:
  triage:
    goal: >-
      Capture observed vs expected behavior, environment, and exact trigger.
      Confirm against code, docs, and specs that the report describes a genuine
      defect, resolving any ambiguity with the user. Write the Report section of
      `bugs/{task}/diagnosis.md` (or update it on re-entry).
    produces: [diagnosis]
    exit_gate: "Observed vs expected behavior and trigger are recorded in diagnosis.md and confirmed as a defect."
    transitions:
      - outcome: not_a_defect
        when: "Behavior is intended or user declines to pursue."
        to: abort
        reason: "not a defect, or declined"
      - outcome: triaged
        to: reproduce
        reason: "captured clearly enough to reproduce"

  reproduce:
    goal: >-
      Reproduce the bug reliably on demand. Reduce it to minimal steps and,
      where possible, capture it as a failing automated test. Record the
      reproduction steps and test path in `diagnosis.md`. Do not fix the bug.
    consumes: [diagnosis]
    produces: [diagnosis]
    exit_gate: "Bug reproduces deterministically from recorded steps/test in diagnosis.md."
    transitions:
      - outcome: report_contradicted
        when: "Reproduction showed the report is inaccurate or describes expected behavior."
        to: triage
        reason: "refinement: reproduction contradicted the report"
        max_retries: 2
      - outcome: cannot_reproduce
        when: "Bug cannot be reproduced after varied attempts and user consultation."
        to: abort
        reason: "cannot reproduce"
      - outcome: reproduced
        to: diagnose
        reason: "reproduces reliably"

  diagnose:
    goal: >-
      Trace from the reproduction to the responsible code and prove the root
      cause with evidence (e.g. neutralizing the cause stops the failure).
      Record root cause, proving evidence, blast radius, and recommended fix
      approach in `diagnosis.md`. Remove any diagnostic instrumentation before
      exiting.
    consumes: [diagnosis]
    produces: [diagnosis]
    exit_gate: >-
      Root cause is proven with evidence, blast radius and fix approach are
      recorded in diagnosis.md, and all diagnostic instrumentation is removed.
    transitions:
      - outcome: sharper_repro_needed
        when: "Current reproduction is too broad or flaky to isolate the root cause."
        to: reproduce
        reason: "refinement: needs a sharper reproduction"
        max_retries: 2
      - outcome: report_gap_found
        when: "Diagnosis showed the reported expectation is wrong or part of a broader defect."
        to: triage
        reason: "refinement: deeper reporting gap"
        max_retries: 2
      - outcome: diagnosed
        to: done
        reason: "root cause proven and fix approach recorded"

  abort:
    terminal: true
    goal: "Ended without a proven root cause. Record what was tried and why in diagnosis.md."

  done:
    terminal: true
    goal: "Bug reproduced, root-caused with evidence, and fix approach recorded in diagnosis.md."

herdr:
  suggested_panes:
    - role: repro
      lifecycle: persistent
      purpose: "Reproduction test watcher."
    - role: diagnose
      lifecycle: on-enter-diagnose
      purpose: "Instrumentation, debugger, or log tails."
