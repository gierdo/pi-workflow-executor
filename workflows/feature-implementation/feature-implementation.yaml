name: feature-implementation
version: 5
concurrency: 3
description: >-
  Lifecycle orchestrator for features: drive a feature from intake through
  integration with OpenSpec or plan.md as the system of record: intake ->
  plan (invoking the interactive planning sub-workflow if needed) ->
  implementation (delegating tasks to task-implementation worker
  sub-workflows) -> verify -> review -> archive/land. OpenSpec artifact work follows
  the matching OpenSpec skill; this workflow orchestrates the end-to-end
  lifecycle, supplying parallel worktree coordination, gates, and refinement
  loops. Mechanical verification gates entry to behavioral review, so the
  reviewer always reasons about confirmed-green code.

# OpenSpec conventions (skills, changeRoot, gates, resume) are in the executor
# skill. `{task}` is also the change name.

inputs:
  task:
    description: "Kebab-case feature slug, also the OpenSpec change name (e.g. add-user-pagination)."
    required: true

artifacts:
  plan:
    path: ".workflow/plans/{task}/plan.md"
    description: "Standalone plan when OpenSpec is not used."
  proposal:
    path: "<changeRoot>/proposal.md"
    description: "What and why, with scope boundaries."
  specs_delta:
    path: "<changeRoot>/specs/<capability-path>/spec.md"
    description: "ADDED/MODIFIED/REMOVED/RENAMED requirements with testable scenarios. These are the acceptance criteria."
  design:
    path: "<changeRoot>/design.md"
    description: "How the change is built. Conditional: only when the schema calls for it."
  tasks:
    path: "<changeRoot>/tasks.md"
    description: "Ordered checkbox implementation steps; the unit of progress, so a handoff resumes at the first unchecked task."
  review:
    path: "<changeRoot>/review.md"
    description: "Behavioral review findings against the proposal, delta specs, and design."
  log:
    path: ".workflow/runs/feature-implementation/{task}/workflow-log.md"
    description: "Run journal, available before change creation and after archive."

initial: intake

states:
  intake:
    goal: >-
      Inspect the workspace to determine if a complete plan or OpenSpec change
      already exists for {task}. Verify that actionable tasks and acceptance
      criteria are defined before proceeding. Read affected code and discover/record
      the project's real build, test, lint, and verification commands for later gates.
    subagent: scout
    exit_gate: "Workspace inspected for existing plan or OpenSpec change artifacts and verification commands recorded."
    transitions:
      - outcome: plan_ready
        when: "An actionable plan (plan.md or OpenSpec change tasks with acceptance criteria) already exists."
        to: implementation
        reason: "pre-existing plan verified; proceed to execution"
      - outcome: plan_needed
        when: "No complete plan exists for {task}."
        to: plan
        reason: "plan missing or incomplete; invoke planning sub-workflow"

  plan:
    invoke:
      workflow: planning
    goal: >-
      Run the interactive planning sub-workflow to clarify requirements,
      validate design, and generate worker-ready tasks.
    produces: [proposal, specs_delta, design, tasks, plan]
    exit_gate: "Planning sub-workflow completed successfully with ready tasks."
    transitions:
      - outcome: planned
        when: "exit_gate holds"
        to: implementation
        reason: "planning complete; proceed to implementation"

  implementation:
    invoke:
      workflow: task-implementation
    concurrency: 3
    goal: >-
      Orchestrate execution of planned tasks by delegating each task to
      task-implementation as a child worker sub-workflow. In Herdr environments
      (HERDR_ENV=1), tasks execute concurrently in staged batches (up to
      concurrency ceiling, default 3) within isolated Git worktrees
      ({base-branch}/{task-slug}). Outside Herdr, tasks run sequentially.
      Child worker subagents run bounded intake, implement changes, verify
      tests, and undergo in-worktree review before reporting done. Task
      worktrees are retained across the batch. If any child reports blocked,
      hand off to planning_revision.
    consumes: [proposal, specs_delta, design, tasks]
    produces: [tasks]
    exit_gate: "All batch tasks completed in `done`: implemented, verified, reviewed in-worktree, with evidence."
    transitions:
      - outcome: implementation_blocked
        when: "A child ended in `blocked`: task infeasible, under-specified, or verification failed."
        to: planning_revision
        reason: "refinement: task implementation blocked; revise plan or specs"
        max_retries: 2
      - outcome: implemented
        when: "exit_gate holds"
        to: verification
        reason: "all tasks implemented with checks and in-worktree review"

  planning_revision:
    invoke:
      workflow: planning
      inputs:
        revision: true
    goal: >-
      Re-invoke the planning sub-workflow to reconcile the plan or specs
      with what implementation or review uncovered. Revise whichever of proposal,
      delta specs, design, tasks, or plan.md are wrong and keep them coherent.
    consumes: [proposal, specs_delta, design, tasks, review, plan]
    produces: [proposal, specs_delta, design, tasks, plan]
    exit_gate: "Plan and specs reconciled."
    transitions:
      - outcome: plan_reconciled
        when: "exit_gate holds"
        to: implementation
        reason: "plan reconciled; resume implementation"

  verification:
    goal: >-
      Run the full mechanical verification suite with the commands recorded in
      intake (build, tests, lint, project checks) and `openspec validate`.
      Mechanical only: no behavioral judgment.
    exit_gate: "The full suite and `openspec validate` run and pass with no errors or warnings."
    transitions:
      - outcome: verification_failed
        when: "A check errored, failed, or could not be run."
        to: implementation
        reason: "verification failed"
        max_retries: 2
      - outcome: verified
        when: "exit_gate holds"
        to: review
        reason: "suite green; safe to review behavior"

  review:
    goal: >-
      Review the diff behaviorally against the change: does it do what the delta
      specs' scenarios require, are edge cases handled, is it coherent with the
      proposal and design? The code is already green, so focus on behavior and
      design. Record actionable findings in review.md.
    subagent: reviewer
    consumes: [proposal, specs_delta, design]
    produces: [review]
    exit_gate: >-
      No blocking defects remain (or all were resolved), and every acceptance
      criterion in the delta specs is demonstrably met by the running software.
    transitions:
      - outcome: review_defects_found
        when: "Defects must be fixed in the implementation."
        to: implementation
        reason: "review found defects; fix then re-verify"
        max_retries: 2
      - outcome: review_spec_gap
        when: "The proposal, delta specs, or design themselves are wrong or incomplete."
        to: planning_revision
        reason: "refinement: review surfaced a spec/plan gap"
        max_retries: 2
      - outcome: review_passed
        when: "exit_gate holds"
        to: integration
        reason: "review passed and criteria met"

  integration:
    goal: >-
      Acts as the integration barrier for worktree tasks and lands the change:
      1. When running with parallel worktrees, sequentially merges task
      branches ({base-branch}/{task-slug}) into the base branch without
      remote pushes. If merge conflicts occur, aborts merge and returns to the
      task worktree for resolution.
      2. Runs final integration verification across merged code.
      3. Cleans up task worktrees via `herdr worktree remove`.
      4. Lands the work per repo conventions and archives the change
      (`openspec-archive-change`).
    consumes: [proposal, specs_delta]
    exit_gate: >-
      Merged into base branch, full integration verified, task worktrees
      cleaned up, committed, docs updated, change synced and archived (or user
      deferred it).
    transitions:
      - outcome: integration_defect
        when: "Landing or merging surfaced a problem needing a code change."
        to: implementation
        reason: "integration surfaced a defect; fix then re-verify"
        max_retries: 2
      - outcome: sync_gap
        when: "Sync or archive hit a blocking condition in the planning artifacts."
        to: planning_revision
        reason: "refinement: sync/archive surfaced a planning gap"
        max_retries: 2
      - outcome: integrated
        when: "exit_gate holds"
        to: done
        reason: "work landed and change archived"
        requires_approval: true

  done:
    terminal: true
    goal: >-
      Oriented, proposed, implemented, verified, reviewed, and integrated, with
      delta specs synced and the change archived.

herdr:
  suggested_panes:
    - role: verify
      lifecycle: persistent
      purpose: "Live build/test status for the implementation and verification gates."
    - role: review
      lifecycle: on-enter-review
      purpose: "Hosts a reviewer agent during the review state."
