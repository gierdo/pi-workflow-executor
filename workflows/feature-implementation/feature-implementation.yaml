name: feature-implementation
version: 6
concurrency: 3
description: >-
  Lifecycle orchestrator for features from intake through landing: intake ->
  plan (invoking planning if needed) -> implementation (delegating wave tasks
  to task-implementation workers and merging parallel worktree waves into the
  base branch as each wave completes) -> verification -> review -> integration.
  Supports both OpenSpec changes and standalone plan.md artifacts.

inputs:
  task:
    description: "Kebab-case feature slug (also OpenSpec change name when OpenSpec is used)."
    required: true

artifacts:
  plan:
    path: ".workflow/plans/{task}/plan.md"
    description: "Standalone plan and wave-annotated task list when OpenSpec is not used."
  proposal:
    path: "<changeRoot>/proposal.md"
    description: "What and why, with scope boundaries (OpenSpec)."
  specs_delta:
    path: "<changeRoot>/specs/<capability-path>/spec.md"
    description: "ADDED/MODIFIED/REMOVED/RENAMED requirements with testable scenarios (OpenSpec)."
  design:
    path: "<changeRoot>/design.md"
    description: "Architecture and design decisions when required by schema (OpenSpec)."
  tasks:
    path: "<changeRoot>/tasks.md"
    description: "Wave-annotated checkbox tasks; unchecked tasks define remaining work (OpenSpec)."
  review:
    path: ".workflow/runs/feature-implementation/{task}/review.md"
    description: "Behavioral review findings against the plan or OpenSpec specs."

initial: intake

states:
  intake:
    goal: >-
      Check whether a complete plan (.workflow/plans/{task}/plan.md or OpenSpec
      change with specs and tasks) already exists for {task}. Read relevant code
      and config files to record the project's build, test, and lint commands.
    subagent: scout
    exit_gate: "Workspace inspected for existing plan/OpenSpec artifacts and verification commands recorded."
    transitions:
      - outcome: plan_ready
        when: "An actionable plan or OpenSpec change with acceptance criteria and tasks exists."
        to: implementation
        reason: "pre-existing plan verified; proceed to execution"
      - outcome: plan_needed
        when: "No complete plan exists for {task}."
        to: plan
        reason: "plan missing or incomplete; invoke planning sub-workflow"

  plan:
    invoke:
      workflow: planning
    goal: >-
      Run the interactive planning sub-workflow to clarify requirements,
      validate design, and generate wave-structured tasks.
    produces: [proposal, specs_delta, design, tasks, plan]
    exit_gate: "Planning sub-workflow completed with approved plan and tasks."
    transitions:
      - outcome: planned
        to: implementation
        reason: "planning complete; proceed to implementation"

  implementation:
    invoke:
      workflow: task-implementation
    concurrency: 3
    goal: >-
      Execute planned tasks wave by wave via task-implementation child workflows
      (passing parent_task={task} and the resolved plan/change path):
      - Single-task waves (or any run outside Herdr, HERDR_ENV!=1) execute
        directly in the main worktree on the base branch without creating worktrees.
      - Multi-task parallel waves in Herdr (HERDR_ENV=1) serially provision
        worktrees ({base-branch}/{task-slug}) up to the concurrency ceiling
        (default 3), run worker subagents in parallel, and upon wave completion
        sequentially merge each task branch (`git merge --no-ff`) into the base
        branch and remove the wave's worktrees (`herdr worktree remove`) before
        starting the next wave.
      If any child ends in `blocked`, transition to planning_revision.
    consumes: [proposal, specs_delta, design, tasks, plan]
    produces: [tasks, plan]
    exit_gate: >-
      All task waves completed, parallel task branches merged into the base
      branch, and temporary task worktrees cleaned up.
    transitions:
      - outcome: implementation_blocked
        when: "A child task ended in `blocked` due to an infeasible or under-specified plan."
        to: planning_revision
        reason: "task implementation blocked; revise plan or specs"
        max_retries: 2
      - outcome: implemented
        to: verification
        reason: "all waves implemented and merged into base branch"

  planning_revision:
    invoke:
      workflow: planning
      inputs:
        revision: true
    goal: >-
      Re-invoke planning in revision mode to reconcile the plan, specs, or task
      breakdown with findings from implementation, verification, or review.
    consumes: [proposal, specs_delta, design, tasks, review, plan]
    produces: [proposal, specs_delta, design, tasks, plan]
    exit_gate: "Affected plan/OpenSpec artifacts updated and coherent."
    transitions:
      - outcome: plan_reconciled
        to: implementation
        reason: "plan reconciled; resume implementation"

  verification:
    goal: >-
      Run the full verification suite recorded in intake (build, tests, lint)
      on the merged base branch, plus `openspec validate` when OpenSpec is used.
    exit_gate: "Full verification suite and applicable spec validation pass cleanly."
    transitions:
      - outcome: verification_failed
        when: "Any build, test, lint, or validation check failed."
        to: implementation
        reason: "verification failed; fix defects"
        max_retries: 2
      - outcome: verified
        to: review
        reason: "suite green; proceed to behavioral review"

  review:
    goal: >-
      Perform behavioral and design review of the integrated diff on the base
      branch against the plan or OpenSpec delta specs. Record findings in the
      review artifact.
    subagent: reviewer
    consumes: [proposal, specs_delta, design, plan]
    produces: [review]
    exit_gate: "No blocking defects remain and all acceptance criteria are met."
    transitions:
      - outcome: review_defects_found
        when: "Code defects require implementation fixes."
        to: implementation
        reason: "review found defects; fix then re-verify"
        max_retries: 2
      - outcome: review_spec_gap
        when: "The plan or OpenSpec specs themselves are incomplete or wrong."
        to: planning_revision
        reason: "review surfaced a spec or plan gap"
        max_retries: 2
      - outcome: review_passed
        to: integration
        reason: "review passed and criteria met"

  integration:
    goal: >-
      Act as the final integration barrier to land the feature: verify no stray
      task worktrees or temporary files remain, commit/land changes per repo
      conventions, and when OpenSpec is used, sync delta specs and archive the
      change (`openspec-archive-change`).
    consumes: [proposal, specs_delta, plan]
    exit_gate: >-
      All worktrees cleaned up, changes committed per repo conventions, and
      OpenSpec change synced/archived if applicable.
    transitions:
      - outcome: integration_defect
        when: "Final landing surfaced a defect requiring code changes."
        to: implementation
        reason: "integration surfaced a defect; fix then re-verify"
        max_retries: 2
      - outcome: sync_gap
        when: "OpenSpec sync or archive hit an artifact gap."
        to: planning_revision
        reason: "sync/archive surfaced a planning gap"
        max_retries: 2
      - outcome: integrated
        to: done
        reason: "work landed and archived"
        requires_approval: true

  done:
    terminal: true
    goal: "Feature implemented, verified, reviewed, and integrated."

herdr:
  suggested_panes:
    - role: verify
      lifecycle: persistent
      purpose: "Live build/test status for implementation and verification gates."
    - role: review
      lifecycle: on-enter-review
      purpose: "Hosts a reviewer agent during the review state."
