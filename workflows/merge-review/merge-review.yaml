name: merge-review
version: 2
description: >-
  Review a change (PR/MR, branch diff, or patch) against its stated intent and
  project standards, delivering prioritized, actionable findings without
  modifying the code under review.

inputs:
  task:
    description: "Kebab-case slug identifying this review (e.g. pr-1234-pagination)."
    required: true
  target:
    description: "PR/MR reference, branch/commit range, or patch file under review."
    required: true
  base_branch:
    description: "Merge target branch (e.g. main). Ask the user if not supplied."
    required: true

artifacts:
  scope:
    path: "reviews/{task}/scope.md"
    description: >-
      Target ref, base branch, resolved merge-base SHA (`git merge-base
      origin/{base_branch} {change_ref}`), exact diff command (`git diff
      origin/{base_branch}...{change_ref}`), stated intent, judging criteria,
      and review scope boundaries.
  findings:
    path: "reviews/{task}/findings.md"
    description: >-
      Actionable findings with location, severity (blocker/major/minor/nit/question),
      rationale, and suggested direction, plus areas verified sound and the
      overall review verdict.

initial: scope

states:
  scope:
    goal: >-
      Identify the target and base branch (asking the user if base_branch was
      omitted). Fetch the base branch, resolve the merge-base SHA, and record
      `git diff origin/{base_branch}...{change_ref}` and `git log --oneline
      origin/{base_branch}..{change_ref}` in `reviews/{task}/scope.md` along
      with the change's stated intent, acceptance criteria, and scope boundaries.
    produces: [scope]
    exit_gate: "Target, base branch, merge-base SHA, three-dot diff command, intent, and criteria recorded in scope.md."
    transitions:
      - outcome: scope_established
        to: understand
        reason: "scope and diff established"

  understand:
    goal: >-
      Read the full three-dot diff in context alongside surrounding code to
      understand the change's architecture, data flow, and approach before
      passing judgment.
    consumes: [scope]
    exit_gate: "Code paths and approach are understood in context with no comprehension gaps."
    transitions:
      - outcome: scope_gap_found
        when: "Reading the diff showed the stated intent or scope boundary is ambiguous or wrong."
        to: scope
        reason: "refinement: understanding exposed a scope gap"
        max_retries: 2
      - outcome: understood
        to: assess
        reason: "change understood; assess against criteria"

  assess:
    goal: >-
      Evaluate behavioral correctness, edge cases, error handling, security at
      trust boundaries, test coverage, and maintainability against `scope.md`.
      Record each issue (with file:line, severity, reason, and suggestion) and
      sound areas in `reviews/{task}/findings.md`.
    subagent: reviewer
    consumes: [scope]
    produces: [findings]
    exit_gate: "All in-scope changes assessed and findings recorded with locations and severities."
    transitions:
      - outcome: comprehension_gap_found
        when: "Assessment requires deeper context on surrounding code."
        to: understand
        reason: "refinement: assessment needs deeper understanding"
        max_retries: 2
      - outcome: assessed
        to: triage
        reason: "assessment complete; prioritize findings"

  triage:
    goal: >-
      Separate blockers and majors from minors, nits, and questions. Ensure
      every blocking item is actionable without follow-up guesswork, and record
      the overall verdict (approve, approve-with-comments, or request-changes)
      in `findings.md`.
    consumes: [scope, findings]
    produces: [findings]
    exit_gate: "Findings prioritized, blockers verified actionable, and verdict recorded in findings.md."
    transitions:
      - outcome: misread_finding
        when: "Triage showed a finding rested on a misreading of the code."
        to: understand
        reason: "refinement: finding based on a misread"
        max_retries: 2
      - outcome: criteria_gap_found
        when: "Judging criteria in scope.md are incomplete or wrong."
        to: scope
        reason: "refinement: triage surfaced a criteria gap"
        max_retries: 2
      - outcome: triaged
        to: deliver
        reason: "findings triaged and verdict approved for delivery"
        requires_approval: true

  deliver:
    goal: >-
      Post or deliver the grouped findings and verdict to the project's review
      channel (PR/MR comments via CLI or agreed location).
    consumes: [scope, findings]
    exit_gate: "Findings and verdict delivered to the review channel."
    transitions:
      - outcome: changes_pushed
        when: "Author pushed new commits requiring re-evaluation before delivery completed."
        to: understand
        reason: "loop: author updated change; re-review"
        max_retries: 2
      - outcome: delivered
        to: done
        reason: "review delivered"

  done:
    terminal: true
    goal: "Change reviewed and findings delivered."

herdr:
  suggested_panes:
    - role: diff
      lifecycle: persistent
      purpose: "Live view of the diff under review."
    - role: author
      lifecycle: on-enter-deliver
      purpose: "Hosts author discussion during delivery."
