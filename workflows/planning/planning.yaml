name: planning
version: 2
description: >-
  Interactively turn a user request into an approved plan and parallel-ready
  task breakdown (OpenSpec change artifacts when OpenSpec is present, or
  standalone .workflow/plans/{task}/plan.md). Never writes production code.
  When invoked with `revision: true`, fast-tracks directly to reconciling
  existing artifacts.

inputs:
  task:
    description: "Kebab-case slug identifying what is being planned."
    required: true
  revision:
    description: "Set to true when revising an existing plan or spec gap."
    required: false

artifacts:
  plan:
    path: ".workflow/plans/{task}/plan.md"
    description: >-
      Standalone plan when OpenSpec is absent: intent, scope, effort level,
      binary Ideal State Criteria (ISC), chosen approach, architecture, risks,
      and wave-grouped Tasks.
  proposal:
    path: "<changeRoot>/proposal.md"
    description: "What and why, with scope boundaries (OpenSpec)."
  specs_delta:
    path: "<changeRoot>/specs/<capability-path>/spec.md"
    description: "Delta specs with testable scenarios and acceptance criteria (OpenSpec)."
  design:
    path: "<changeRoot>/design.md"
    description: "Architecture and design decisions (OpenSpec)."
  tasks:
    path: "<changeRoot>/tasks.md"
    description: "Ordered, wave-grouped worker tasks (OpenSpec)."

initial: investigate

states:
  investigate:
    goal: >-
      Orient quickly: inspect tech stack, conventions, relevant code, and
      whether OpenSpec (`openspec/`) is present. Use a scout if the area is
      unfamiliar.
      - If `revision: true` (or an existing plan/change is being reconciled for
        a reported blocker or gap), summarize the needed revision and transition
        via `revision_ready` directly to `write_plan`.
      - Otherwise, summarize the context and detected planning mode (OpenSpec vs
        standalone plan.md) in 2-4 sentences and proceed to `clarify`.
    exit_gate: "Codebase context and planning mode (OpenSpec vs standalone, fresh vs revision) established."
    transitions:
      - outcome: revision_ready
        when: "Invoked with revision: true or reconciling an existing plan/spec gap."
        to: write_plan
        reason: "fast-track revision to plan update"
      - outcome: oriented
        to: clarify
        reason: "oriented; clarify requirements and acceptance criteria"

  clarify:
    goal: >-
      Confirm intent, resolve genuine requirement ambiguities (scope boundaries,
      non-obvious edge cases, effort/quality level), and draft compact binary
      Ideal State Criteria (ISC). Group questions concisely and do not ask what
      the codebase already answers. Present the clarified intent, assumptions,
      and ISC to the user, then call `workflow_transition` for approval.
    exit_gate: "Intent, scope, effort level, and testable ISC are confirmed by the user."
    transitions:
      - outcome: clarified
        to: design
        reason: "requirements and ISC confirmed; validate approach and design"
        requires_approval: true

  design:
    goal: >-
      Propose 2-3 approaches with tradeoffs (leading with a YAGNI recommendation
      tied to the ISC), outline the architecture/data flow/module boundaries for
      the recommended approach, and surface 2-4 key premortem risks or failure
      modes. Favor clean module boundaries that allow independent parallel task
      execution. Present the design and call `workflow_transition` for approval.
    exit_gate: "Approach, architecture, module boundaries, and risk mitigations are approved by the user."
    transitions:
      - outcome: requirements_reshaped
        when: "Design discussion reshaped the requirements or ISC."
        to: clarify
        reason: "refinement: design exposed a requirements gap"
        max_retries: 2
      - outcome: design_approved
        to: write_plan
        reason: "design validated; author plan artifacts"
        requires_approval: true

  write_plan:
    goal: >-
      Write or revise the planning artifacts:
      - OpenSpec present: write/update `proposal.md`, delta specs in `specs/`,
        and `design.md` (via `openspec-propose` or `openspec-update-change`).
      - OpenSpec absent: write/update `.workflow/plans/{task}/plan.md` (intent,
        scope, ISC, approach, architecture, and risks).
      Present the written artifact paths and summary, then call
      `workflow_transition` for approval.
    produces: [plan, proposal, specs_delta, design]
    exit_gate: "Plan artifacts are written/updated at the agreed paths and approved by the user."
    transitions:
      - outcome: design_gap_found
        when: "Writing the plan exposed an unresolved design flaw."
        to: design
        reason: "refinement: writing the plan exposed a design gap"
        max_retries: 2
      - outcome: plan_approved
        to: task_breakdown
        reason: "plan approved; generate parallel-aware task breakdown"
        requires_approval: true

  task_breakdown:
    goal: >-
      Decompose the plan into coherent implementation tasks (into
      `<changeRoot>/tasks.md` for OpenSpec, or the Tasks section of `plan.md`):
      1. Group tasks into explicit execution waves (`Wave 1`, `Wave 2`, ...).
         Partition tasks within a multi-task wave across disjoint files/modules
         so they can execute concurrently in isolated git worktrees without
         merge conflicts. Mark single-task foundation or integration waves as
         `[sequential]` and independent multi-task waves as `[parallel]`.
      2. Each task must specify: target files to touch, applicable constraints
         and anti-patterns, a concrete code snippet or file:line reference to
         follow, and verifiable acceptance criteria tied to the ISC.
      Present the task breakdown and call `workflow_transition` for approval.
    consumes: [plan, proposal, specs_delta, design]
    produces: [plan, tasks]
    exit_gate: >-
      Tasks are grouped into explicit sequential/parallel waves with disjoint
      file ownership per parallel wave, complete with file references,
      constraints, and acceptance criteria, and approved by the user.
    transitions:
      - outcome: plan_gap_found
        when: "Task breakdown exposed a gap in the plan or specs."
        to: write_plan
        reason: "refinement: task breakdown exposed a plan gap"
        max_retries: 2
      - outcome: tasks_approved
        to: done
        reason: "plan and wave-structured task breakdown are ready"
        requires_approval: true

  done:
    terminal: true
    goal: "Plan and wave-structured task breakdown are written and approved."

herdr:
  suggested_panes:
    - role: plan
      lifecycle: persistent
      purpose: "Holds plan.md or OpenSpec tasks.md during write_plan and task_breakdown."
    - role: scout
      lifecycle: on-demand
      purpose: "Hosts a scout agent spawned to fill codebase-fact gaps."
