name: refactoring
version: 2
description: >-
  Improve internal code structure without changing observable behavior: define
  the structural goal and preservation boundary, lock in a green characterization
  baseline, plan small behavior-preserving steps, apply transforms while keeping
  tests green, and verify preservation against the baseline.

inputs:
  task:
    description: "Kebab-case slug identifying this refactoring (e.g. extract-auth-service)."
    required: true

artifacts:
  goal:
    path: "refactors/{task}/goal.md"
    description: >-
      Structural problem, target shape, scope boundary, and concrete definition
      of observable behavior that must remain unchanged.
  baseline:
    path: "refactors/{task}/baseline.md"
    description: >-
      Existing test coverage, added characterization tests, and recorded green
      baseline outputs.
  plan:
    path: "refactors/{task}/plan.md"
    description: "Ordered, individually verifiable, behavior-preserving transformation steps."

initial: goal

states:
  goal:
    goal: >-
      Define the structural problem, target shape, scope boundary, and concrete
      observable behavior (public APIs, outputs, side effects) in
      `refactors/{task}/goal.md`. Confirm no behavior change is required.
    produces: [goal]
    exit_gate: "Structural goal, scope boundary, and observable behavior boundary recorded in goal.md."
    transitions:
      - outcome: requires_behavior_change
        when: "Work requires changing observable behavior (belongs in feature-implementation or bug-fix)."
        to: abort
        reason: "not a refactoring: behavior change required"
      - outcome: goal_defined
        to: characterize
        reason: "structural goal and preservation boundary defined"

  characterize:
    goal: >-
      Audit existing tests covering the scoped code, add characterization tests
      to close coverage gaps, run the suite, and record the green baseline in
      `refactors/{task}/baseline.md`.
    consumes: [goal]
    produces: [baseline]
    exit_gate: "Observable behavior in scope is covered by passing tests and recorded in baseline.md."
    transitions:
      - outcome: scope_gap_found
        when: "Characterization showed the goal's scope or behavior boundary is incomplete."
        to: goal
        reason: "refinement: characterization exposed a goal/scope gap"
        max_retries: 2
      - outcome: baseline_established
        to: plan
        reason: "trustworthy behavioral baseline established"

  plan:
    goal: >-
      Decompose the refactoring into small, ordered, individually
      behavior-preserving steps in `refactors/{task}/plan.md`, specifying how
      each step is verified against the baseline.
    consumes: [goal, baseline]
    produces: [plan]
    exit_gate: "Ordered, individually verifiable transformation steps recorded in plan.md."
    transitions:
      - outcome: weak_baseline_found
        when: "A planned step could alter behavior undetected without additional characterization tests."
        to: characterize
        reason: "refinement: plan requires stronger baseline coverage"
        max_retries: 2
      - outcome: goal_invalidated
        when: "Target shape cannot be reached without altering observable behavior."
        to: goal
        reason: "refinement: plan invalidated the goal"
        max_retries: 2
      - outcome: plan_ready
        to: transform
        reason: "incremental transformation plan ready"

  transform:
    goal: >-
      Apply the planned steps in order, running the test suite after each step
      to confirm it stays green. Revert or fix any step that breaks tests before
      proceeding.
    consumes: [goal, baseline, plan]
    exit_gate: "All transformation steps applied, target structure reached, and test suite green."
    transitions:
      - outcome: step_unsafe
        when: "A step broke behavior or proved unsafe and requires re-planning."
        to: plan
        reason: "refinement: transform step unsafe"
        max_retries: 2
      - outcome: goal_flaw_found
        when: "Transformation proved the target shape or preservation boundary wrong."
        to: goal
        reason: "refinement: transformation invalidated goal"
        max_retries: 2
      - outcome: transformed
        to: verify
        reason: "target shape reached with suite green"

  verify:
    goal: >-
      Run the full project verification suite (build, tests, lint) and compare
      against `baseline.md`. Confirm observable behavior is unchanged and no
      characterization tests were weakened or deleted.
    consumes: [goal, baseline]
    exit_gate: "Full suite passes, observable behavior matches baseline.md, and structural goal is met."
    transitions:
      - outcome: behavior_diverged
        when: "A check failed, behavior diverged from baseline, or a test was weakened."
        to: transform
        reason: "verification failed or behavior diverged"
        max_retries: 2
      - outcome: verified
        to: done
        reason: "behavior preserved and structural goal met"

  abort:
    terminal: true
    goal: "Stopped: work requires an observable behavior change. Hand off to feature-implementation or bug-fix."

  done:
    terminal: true
    goal: "Internal structure improved with observable behavior provably preserved."

herdr:
  suggested_panes:
    - role: verify
      lifecycle: persistent
      purpose: "Runs the test suite after each transform step."
    - role: baseline
      lifecycle: on-enter-characterize
      purpose: "Holds recorded baseline behavior for comparison."
