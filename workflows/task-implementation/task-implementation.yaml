name: task-implementation
version: 3
description: >-
  Bounded leaf execution engine: implement a single pre-planned task from a
  plan artifact or OpenSpec change, verify it mechanically, and optionally
  review it in-worktree. Never re-plans or expands scope; under-specified or
  infeasible tasks terminate in `blocked` for parent re-planning.

inputs:
  task:
    description: "Kebab-case slug identifying this unit of implementation work."
    required: true
  parent_task:
    description: "Optional parent feature/bug slug when invoked as a child workflow."
    required: false
  plan_path:
    description: "Optional explicit path to plan.md or OpenSpec change root."
    required: false

artifacts:
  plan:
    path: ".workflow/plans/{task}/plan.md"
    description: >-
      Upstream plan or OpenSpec change (`<changeRoot>/tasks.md` + `specs/`).
      When `plan_path` or `parent_task` is supplied by the parent orchestrator,
      read from that location instead of `.workflow/plans/{task}/plan.md`.
  evidence:
    path: ".workflow/runs/task-implementation/{task}/implementation-evidence.md"
    description: "Files changed, verification commands run, actual output, and ISC criteria met."

initial: intake

states:
  intake:
    goal: >-
      Read the assigned task from `plan_path`, `<changeRoot>/tasks.md`, or
      `.workflow/plans/{parent_task|task}/plan.md`. Confirm it includes target
      files, a code example or existing-code reference, explicit constraints,
      and testable acceptance criteria. If running in an isolated git worktree
      whose dependencies (e.g. `node_modules`) are missing, link or install them
      before proceeding.
    consumes: [plan]
    exit_gate: >-
      Task specification is complete (files, example/reference, constraints,
      acceptance criteria) and the workspace environment is ready to build/test.
    transitions:
      - outcome: under_specified
        when: "Task is missing examples/references, constraints, or acceptance criteria."
        to: blocked
        reason: "task under-specified: return to planner rather than guess"
      - outcome: context_ready
        to: implement
        reason: "task specification and environment ready"

  implement:
    goal: >-
      Implement only the assigned task following the referenced patterns and
      constraints. Keep changes scoped to the task's target files so parallel
      worktrees do not collide. If implementation proves the plan wrong or
      infeasible, transition to `blocked`.
    subagent: worker
    consumes: [plan]
    exit_gate: "Task code is written within scope and compiles cleanly."
    transitions:
      - outcome: plan_invalidated
        when: "Implementation proved the task or plan infeasible or wrong."
        to: blocked
        reason: "plan invalidated: hand back to parent planning"
      - outcome: implemented
        to: verify
        reason: "task implemented; run verification"

  verify:
    goal: >-
      Run the project's build and relevant tests (and exercise runtime endpoints
      for integration/framework changes). Record commands, outputs, and met
      acceptance criteria in the evidence artifact. Clean up temporary files.
    consumes: [plan]
    produces: [evidence]
    exit_gate: >-
      Build and relevant tests pass, acceptance criteria are verified with
      recorded evidence, and temporary files are removed.
    transitions:
      - outcome: verification_failed
        when: "Build, test, or acceptance check failed due to a defect in this task's code."
        to: implement
        reason: "verification failed; fix implementation"
        max_retries: 2
      - outcome: cannot_verify
        when: "Build or tests cannot execute in this environment."
        to: blocked
        reason: "cannot verify in environment: surface blocker"
      - outcome: verified
        to: task_review
        reason: "verified with evidence; proceed to review"

  task_review:
    goal: >-
      Check the task diff for correctness, security, and adherence to the plan's
      constraints. When invoked inside a parent workflow that performs an
      integrated behavioral review (`feature-implementation`), keep this check
      focused on task-local invariants and file-scope discipline.
    subagent: reviewer
    exit_gate: "Task diff meets correctness, security, and scope criteria."
    transitions:
      - outcome: review_defects_found
        when: "Reviewer flags code quality, security, or correctness issues."
        to: implement
        reason: "remediation: fix review defects within task worktree"
        max_retries: 2
      - outcome: review_passed
        to: report
        reason: "review passed; finalize report"

  report:
    goal: >-
      Finalize the evidence artifact with changed files, verification outputs,
      and any caveats, then report completion.
    consumes: [evidence]
    exit_gate: "Evidence artifact is complete and reported."
    transitions:
      - outcome: reported
        to: done
        reason: "task delivered with evidence"

  blocked:
    terminal: true
    goal: "Halted: report the exact missing context, plan flaw, or verification blocker to the caller."

  done:
    terminal: true
    goal: "Task implemented, verified, reviewed, and reported with evidence."

herdr:
  suggested_panes:
    - role: verify
      lifecycle: persistent
      purpose: "Live build/test status for implement and verify gates."
